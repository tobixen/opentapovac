<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OpenTapoVac</title>
<style>
  :root { --bg: #f6f6f4; --fg: #1c1c1c; --card: #fff; --muted: #6b6b6b; --line: #ddd;
          --accent: #2d6cdf; --on: #dbe6fb; --stop: #c62828; --warn: #b26a00; --alert: #c62828; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #161616; --fg: #eee; --card: #222; --muted: #a0a0a0; --line: #3a3a3a;
            --accent: #6d9bf1; --on: #243552; --stop: #e05252; --warn: #e0a040; --alert: #ff6b6b; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.4 system-ui, sans-serif; }
  main { max-width: 40rem; margin: 0 auto; padding: 12px 16px 40px; }
  h1 { font-size: 1.2rem; margin: 4px 0 12px; }
  h2 { font-size: .8rem; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin: 18px 0 6px; }
  section { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 12px; margin-bottom: 12px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(8.5rem, 1fr)); gap: 8px; }
  button { font: inherit; padding: 12px 10px; border-radius: 8px; border: 1px solid var(--line);
           background: var(--card); color: var(--fg); cursor: pointer; min-height: 48px; }
  button.on { background: var(--on); border-color: var(--accent); }
  button.primary { background: var(--accent); color: #fff; border-color: var(--accent); width: 100%; margin-top: 10px; }
  button.stop { background: var(--stop); color: #fff; border: none; width: 100%; font-size: 1.2rem; font-weight: 600; min-height: 64px; }
  button:disabled { opacity: .5; cursor: default; }
  .modes { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  #status .big { font-size: 1.3rem; font-weight: 600; }
  #status .sub { color: var(--muted); }
  #job { margin-top: 6px; }
  #question { margin-top: 10px; padding: 10px; border: 2px solid var(--alert); border-radius: 8px; }
  #qtext { font-weight: 600; font-size: 1.1rem; }
  #qchoices button.primary { margin-top: 8px; }
  #msg { color: var(--alert); min-height: 1.2em; margin-top: 6px; }
  #log { list-style: none; margin: 0; padding: 0; max-height: 18rem; overflow-y: auto; font-size: .9rem; }
  #log li { padding: 3px 0; border-bottom: 1px solid var(--line); }
  #log time { color: var(--muted); font-variant-numeric: tabular-nums; margin-right: 6px; }
  #log .warn { color: var(--warn); } #log .alert, #log .error { color: var(--alert); font-weight: 600; }
  #map { width: 100%; height: auto; border-radius: 6px; background: #fff; }
  .row { display: flex; gap: 8px; align-items: center; justify-content: space-between; }
</style>
</head>
<body>
<main>
  <h1>OpenTapoVac</h1>

  <section id="status">
    <div class="big" id="state">…</div>
    <div class="sub" id="details"></div>
    <div id="job"></div>
    <div id="question" hidden>
      <div id="qtext"></div>
      <div class="modes" id="qchoices"></div>
    </div>
    <div id="msg"></div>
  </section>

  <button class="stop" id="stop">Stop</button>

  <h2>Presets</h2>
  <div class="grid" id="presets"></div>

  <h2>Rooms</h2>
  <section>
    <div class="grid" id="rooms"></div>
    <h2>Mode</h2>
    <div class="modes" id="modes"></div>
    <button class="primary" id="start" disabled>Start</button>
  </section>

  <h2>Log</h2>
  <section><ul id="log"></ul></section>

  <h2 class="row">Map <button id="reload">Reload</button></h2>
  <section><img id="map" alt="map with the last track"></section>
</main>
<script src="/static/app.js"></script>
</body>
</html>
