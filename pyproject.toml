[build-system]
# argcomplete is a runtime dependency too, but the build needs it as well:
# hatch_build.py generates the shell completion files from it (see that file).
requires = ["hatchling", "hatch-vcs", "argcomplete>=3"]
build-backend = "hatchling.build"

[project]
name = "opentapovac"
dynamic = ["version"]
description = "Local control of a TP-Link Tapo robot vacuum: CLI, daemon and web page"
readme = "README.md"
# python-kasa needs 3.11
requires-python = ">=3.11"
# the vendored TPAP transport (src/opentapovac/_tpap.py) is python-kasa's, GPL
license = "AGPL-3.0-or-later AND GPL-3.0-or-later"
license-files = ["LICENSE", "LICENSE.python-kasa"]
authors = [{ name = "Tobias Brox", email = "tobias@redpill-linpro.com" }]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
dependencies = [
  # TPAP is not in a python-kasa release yet: opentapovac/_tpap.py is the
  # transport from the PR branch, see docs/design.md, "Decisions".
  # ecdsa and passlib are its dependencies.
  "python-kasa>=0.10.2",
  "ecdsa>=0.19.1",
  "passlib>=1.7.4",
  "aiohttp>=3.9",
  "argcomplete>=3",
  "lz4>=4",
  "pillow>=10",
  "pyyaml>=6",
]

[project.optional-dependencies]
# hatchling is here so the tests can exercise hatch_build.py
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.16", "pre-commit>=4", "hatchling"]

[project.scripts]
opentapovac = "opentapovac.cli:main"

[project.urls]
Repository = "https://github.com/tobixen/opentapovac"
Issues = "https://github.com/tobixen/opentapovac/issues"

[tool.hatch.version]
source = "vcs"
# only release tags: the review workflow's backup/pre-review/* tags don't parse as versions
raw-options = { scm = { git = { describe_command = ["git", "describe", "--dirty", "--tags", "--long", "--match", "v*"] } } }

[tool.hatch.build.hooks.vcs]
version-file = "src/opentapovac/_version.py"

# hatch_build.py: generates the bash/zsh completion files into the wheel's
# shared-data, so tab-completion works with no shell rc editing.
[tool.hatch.build.hooks.custom]

[tool.hatch.build.targets.wheel]
packages = ["src/opentapovac"]

[tool.ruff]
line-length = 120
target-version = "py311"
# vendored from python-kasa, kept diffable against it
extend-exclude = ["src/opentapovac/_tpap.py", "tests/test_tpap.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "PT"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["opentapovac"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# runs from a bare checkout too (the pre-push hook uses the system pytest)
pythonpath = ["src", "."]
python_files = ["test_*.py"]
filterwarnings = [
  "error",
  # passlib (for the vendored TPAP transport) imports crypt on Python < 3.13
  "ignore:'crypt' is deprecated:DeprecationWarning",
]
norecursedirs = ["docs", "build"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
